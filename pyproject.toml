[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "evograph"
version = "0.1.0"
description = "Evolution as a biased random walk on trait-state graphs"
authors = [{ name = "Henry Ji" }, { name = "Calvin Zhang" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["evograph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
