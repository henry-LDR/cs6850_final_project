[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "evograph"
version = "0.1.0"
description = "Network analysis of convergent body-form evolution in squamates"
authors = [{ name = "Henry Ji" }, { name = "Calvin Zhang" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pandas>=2.0", "openpyxl>=3.1", "networkx>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["evograph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
